<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM TimeTable - SMP Negeri 1 Bangsal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .sidebar { width: 260px; height: 100vh; background: #2c3e50; color: #fff; position: fixed; top: 0; left: 0; padding-top: 20px; z-index: 100; }
    .sidebar a { padding: 12px 20px; text-decoration: none; font-size: 15px; color: #cfd8dc; display: block; transition: 0.3s; }
    .sidebar a:hover, .sidebar a.active { background: #34495e; color: #ffffff; border-left: 4px solid #3498db; }
    .main-content { margin-left: 260px; padding: 25px; }
    .table-matrix th, .table-matrix td { vertical-align: middle; font-size: 0.85rem; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; flex-direction: column; }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay d-none">
    <div class="spinner-border text-light mb-2" role="status"></div>
    <span id="loadingText">Memuat...</span>
  </div>

  <!-- LOGIN CONTAINER -->
  <div id="login-container" class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="width: 400px;">
      <h3 class="text-center mb-3 fw-bold">SIM TimeTable</h3>
      <p class="text-center text-muted small mb-4">Silakan login untuk mengakses sistem</p>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="loginUser" class="form-control" placeholder="Masukkan username">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="loginPass" class="form-control" placeholder="Masukkan password">
      </div>
      <button class="btn btn-primary w-100 py-2 fw-bold" onclick="prosesLogin()">Masuk Aplikasi</button>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <div id="app-container" class="d-none">
    <!-- Sidebar -->
    <div class="sidebar">
      <h4 class="text-center fw-bold mb-4">SIM Timetable</h4>
      <div class="px-3 mb-3 small text-muted text-uppercase" id="userRoleDisplay">Waka Kurikulum</div>
      <a href="#" class="active" onclick="switchTab('jadwal', this)">📅 Plotting Jadwal</a>
      <a href="#" onclick="switchTab('guru', this)">👨‍🏫 Master Guru</a>
      <a href="#" onclick="switchTab('waktu', this)">⏰ Setting Waktu</a>
      <hr class="text-secondary mx-3">
      <a href="#" class="text-danger" onclick="location.reload()">🚪 Keluar</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      
      <!-- TAB 1: PLOTTING JADWAL -->
      <div id="content-jadwal" class="content-section">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2>PLOTTING JADWAL PELAJARAN</h2>
          <div>
            <button class="btn btn-secondary me-2" onclick="printJadwalMatrix()">🖨️ Cetak Jadwal</button>
            <button class="btn btn-success" onclick="saveJadwalBatchProcess()">💾 Simpan Jadwal</button>
          </div>
        </div>

        <div class="card shadow-sm p-3 mb-4">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">Filter Hari</label>
              <select id="filterHari" class="form-select" onchange="renderMatrixJadwal()">
                <option value="ALL">-- Semua Hari --</option>
                <option value="Senin">Senin</option>
                <option value="Selasa">Selasa</option>
                <option value="Rabu">Rabu</option>
                <option value="Kamis">Kamis</option>
                <option value="Jumat">Jumat</option>
                <option value="Sabtu">Sabtu</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Filter Kelas</label>
              <select id="filterKelas" class="form-select" onchange="renderMatrixJadwal()">
                <option value="ALL">-- Semua Kelas --</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card shadow-sm p-3">
          <div id="matrixContainer" class="table-responsive">
            <!-- Tabel Matriks dimuat di sini -->
          </div>
        </div>
      </div>

      <!-- TAB 2: MASTER GURU -->
      <div id="content-guru" class="content-section d-none">
        <h2>DATA MASTER GURU & KOMPETENSI</h2>
        <div class="card shadow-sm p-3 mt-3">
          <div id="guruContainer" class="table-responsive">
            <!-- Data guru dimuat di sini -->
          </div>
        </div>
      </div>

      <!-- TAB 3: SETTING WAKTU -->
      <div id="content-waktu" class="content-section d-none">
        <h2>SETTING ALOKASI WAKTU</h2>
        <div class="card shadow-sm p-3 mt-3">
          <div id="waktuContainer" class="table-responsive">
            <!-- Data waktu dimuat di sini -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript Utama -->
  <script>
    const WEB_APP_URL = "GANTI_DENGAN_URL_DEPLOYMENT_GAS_ANDA";

    let GLOBAL_DATA = { guru: [], kelas: [], waktu: [], jadwal: [], mapel: [] };
    let currentUser = null;

    const MASTER_MAPEL = [
      { nama: "Pendidikan Agama Islam", jp: 3 },
      { nama: "Pendidikan Pancasila", jp: 3 },
      { nama: "Bahasa Indonesia", jp: 6 },
      { nama: "Matematika", jp: 5 },
      { nama: "Ilmu Pengetahuan Alam", jp: 5 },
      { nama: "Ilmu Pengetahuan Sosial", jp: 4 },
      { nama: "Bahasa Inggris", jp: 4 },
      { nama: "Seni Budaya", jp: 3 },
      { nama: "Pendidikan Jasmani", jp: 3 },
      { nama: "Informatika", jp: 3 }
    ];

    function showLoading(show, text = "Memuat...") {
      const el = document.getElementById("loadingOverlay");
      document.getElementById("loadingText").innerText = text;
      if (show) el.classList.remove("d-none");
      else el.classList.add("d-none");
    }

    function switchTab(tabName, el) {
      document.querySelectorAll('.content-section').forEach(s => s.classList.add('d-none'));
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
      document.getElementById('content-' + tabName).classList.remove('d-none');
      if (el) el.classList.add('active');
    }

    function prosesLogin() {
      const u = document.getElementById("loginUser").value;
      const p = document.getElementById("loginPass").value;
      
      if (!u || !p) {
        alert("Silakan masukkan username dan password!");
        return;
      }

      showLoading(true, "Proses Verifikasi Login...");

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", username: u, password: p })
      })
      .then(res => {
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          return res.text().then(() => {
            throw new Error("Server Google sedang pemanasan (Cold Start). Silakan coba klik Masuk sekali lagi.");
          });
        }
        return res.json();
      })
      .then(res => {
        showLoading(false);
        if (res.status === "success") {
          currentUser = res.user;
          document.getElementById("userRoleDisplay").innerText = currentUser.nama_lengkap || currentUser.role;
          document.getElementById("login-container").classList.add("d-none");
          document.getElementById("app-container").classList.remove("d-none");
          loadInitialData();
        } else {
          alert("Login Gagal: " + res.message);
        }
      })
      .catch(err => {
        showLoading(false);
        alert("Error Login: " + err.message + "\n\nTips: Tunggu 3-5 detik lalu klik tombol 'Masuk Aplikasi' sekali lagi.");
      });
    }

    function loadInitialData(retryCount = 3) {
      showLoading(true, "Mengunduh Data Timetable...");
      
      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getInitialData" })
      })
      .then(res => {
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          return res.text().then(() => {
            throw new Error("Format respons server bukan JSON.");
          });
        }
        return res.json();
      })
      .then(res => {
        showLoading(false);
        if (res.status === "success") {
          GLOBAL_DATA = res.data;
          renderAll();
        } else {
          alert("Gagal memuat data: " + res.message);
        }
      })
      .catch(err => {
        if (retryCount > 1) {
          setTimeout(() => loadInitialData(retryCount - 1), 2000);
        } else {
          showLoading(false);
          alert("Koneksi ke server Google terganggu akibat Cold Start. Silakan refresh halaman browser Anda.");
        }
      });
    }

    function renderAll() {
      const kelasSelect = document.getElementById("filterKelas");
      kelasSelect.innerHTML = '<option value="ALL">-- Semua Kelas --</option>';
      (GLOBAL_DATA.kelas || []).forEach(k => {
        kelasSelect.innerHTML += `<option value="${k.id_kelas}">${k.nama_kelas}</option>`;
      });

      renderMatrixJadwal();
      renderMasterGuru();
      renderMasterWaktu();
    }

    function cleanTimeString(timeStr) {
      if (!timeStr) return "";
      return String(timeStr).substring(0, 5);
    }

    function renderMatrixJadwal() {
      const selHari = document.getElementById("filterHari").value;
      const selKelas = document.getElementById("filterKelas").value;

      let activeKelas = GLOBAL_DATA.kelas || [];
      if (selKelas !== "ALL") {
        activeKelas = activeKelas.filter(k => String(k.id_kelas) === String(selKelas));
      }

      let activeWaktu = GLOBAL_DATA.waktu || [];
      if (selHari !== "ALL") {
        activeWaktu = activeWaktu.filter(w => String(w.hari).toLowerCase() === String(selHari).toLowerCase());
      }

      let headerHtml = `
        <th style="width: 70px;">HARI</th>
        <th style="width: 50px;">JAM KE</th>
        <th style="width: 110px;">WAKTU</th>
        ${activeKelas.map(k => `<th>${k.nama_kelas}</th>`).join('')}
      `;

      const jadwalMap = {};
      (GLOBAL_DATA.jadwal || []).forEach(j => {
        const key = `${String(j.hari).toLowerCase()}_${j.jam_ke}_${j.id_kelas}`;
        if (!jadwalMap[key]) jadwalMap[key] = [];
        jadwalMap[key].push(j);
      });

      let bodyHtml = "";
      const jamKeCounter = {};

      activeWaktu.forEach(w => {
        let waktuDisplay = `${cleanTimeString(w.waktu_mulai)} - ${cleanTimeString(w.waktu_selesai)}`;
        const jamKey = `${String(w.hari).toLowerCase()}_${w.jam_ke}`;
        jamKeCounter[jamKey] = (jamKeCounter[jamKey] || 0);
        const slotIndex = jamKeCounter[jamKey];
        jamKeCounter[jamKey]++;

        let cellsHtml = "";
        activeKelas.forEach(k => {
          const key = `${String(w.hari).toLowerCase()}_${w.jam_ke}_${k.id_kelas}`;
          const matchedList = jadwalMap[key] || [];
          const currentJadwal = matchedList[slotIndex] || {};

          let selectOptions = `<option value="">-- Pilih Guru & Mapel --</option>`;
          (GLOBAL_DATA.guru || []).forEach(g => {
            const kompetensi = (g.kompetensi || "").trim();
            const selectedVal = `${g.id_guru}::${kompetensi}`;
            const isSelected = (String(currentJadwal.id_guru) === String(g.id_guru) && String(currentJadwal.mapel).toLowerCase() === kompetensi.toLowerCase()) ? "selected" : "";
            selectOptions += `<option value="${selectedVal}" ${isSelected}>${g.kode_guru} - ${g.nama_guru} (${kompetensi})</option>`;
            
            MASTER_MAPEL.forEach(m => {
              if (m.nama.toLowerCase() !== kompetensi.toLowerCase()) {
                const nonLinVal = `${g.id_guru}::${m.nama}`;
                const isNonLinSelected = (String(currentJadwal.id_guru) === String(g.id_guru) && String(currentJadwal.mapel).toLowerCase() === m.nama.toLowerCase()) ? "selected" : "";
                selectOptions += `<option value="${nonLinVal}" ${isNonLinSelected}>↳ ${g.kode_guru} - ${g.nama_guru} [Non-Linier: ${m.nama}]</option>`;
              }
            });
          });

          cellsHtml += `
            <td>
              <select class="form-select form-select-sm jadwal-select" data-hari="${w.hari}" data-jam="${w.jam_ke}" data-kelas="${k.id_kelas}">
                ${selectOptions}
              </select>
            </td>
          `;
        });

        bodyHtml += `
          <tr>
            <td class="fw-bold text-center">${w.hari}</td>
            <td class="fw-bold text-center">${w.jam_ke}</td>
            <td class="text-center text-muted small">${waktuDisplay}</td>
            ${cellsHtml}
          </tr>
        `;
      });

      document.getElementById("matrixContainer").innerHTML = `
        <table class="table table-bordered table-sm table-matrix">
          <thead class="table-dark text-center">
            <tr>${headerHtml}</tr>
          </thead>
          <tbody>${bodyHtml}</tbody>
        </table>
      `;
    }

    function renderMasterGuru() {
      let html = `<table class="table table-bordered table-striped"><thead><tr><th>Kode</th><th>Nama Guru & Gelar</th><th>Kompetensi Utama (Linier)</th></tr></thead><tbody>`;
      (GLOBAL_DATA.guru || []).forEach(g => {
        html += `<tr><td><b>${g.kode_guru}</b></td><td>${g.nama_guru}</td><td><span class="badge bg-primary">${g.kompetensi || "-"}</span></td></tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById("guruContainer").innerHTML = html;
    }

    function renderMasterWaktu() {
      let html = `<table class="table table-bordered table-striped text-center"><thead><tr><th>Hari</th><th>Jam Ke</th><th>Mulai</th><th>Selesai</th></tr></thead><tbody>`;
      (GLOBAL_DATA.waktu || []).forEach(w => {
        html += `<tr><td>${w.hari}</td><td><b>${w.jam_ke}</b></td><td>${cleanTimeString(w.waktu_mulai)}</td><td>${cleanTimeString(w.waktu_selesai)}</td></tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById("waktuContainer").innerHTML = html;
    }

    function saveJadwalBatchProcess() {
      const selects = document.querySelectorAll(".jadwal-select");
      const items = [];
      const bobotMap = {};
      
      MASTER_MAPEL.forEach(m => {
        bobotMap[m.nama.toLowerCase()] = m.jp;
      });

      const guruLoadCheck = {};

      selects.forEach(sel => {
        const val = sel.value;
        if (val) {
          const parts = val.split("::");
          const idGuru = parts[0];
          const mapelDiplot = parts[1] || "";
          
          items.push({
            hari: sel.getAttribute("data-hari"),
            jam_ke: parseInt(sel.getAttribute("data-jam")),
            id_kelas: sel.getAttribute("data-kelas"),
            id_guru: idGuru,
            mapel: mapelDiplot
          });

          if (!guruLoadCheck[idGuru]) {
            const guruObj = (GLOBAL_DATA.guru || []).find(g => String(g.id_guru).trim() === String(idGuru).trim());
            guruLoadCheck[idGuru] = {
              nama: guruObj ? guruObj.nama_guru : idGuru,
              kompetensiUtama: guruObj ? (guruObj.kompetensi || "").toLowerCase() : "",
              linierJP: 0,
              nonLinierJP: 0
            };
          }

          let bobot = bobotMap[mapelDiplot.toLowerCase()] !== undefined ? bobotMap[mapelDiplot.toLowerCase()] : 4;

          if (mapelDiplot.toLowerCase() === guruLoadCheck[idGuru].kompetensiUtama) {
            guruLoadCheck[idGuru].linierJP += bobot;
          } else {
            guruLoadCheck[idGuru].nonLinierJP += bobot;
          }
        }
      });

      let pelanggaranList = [];
      for (let idG in guruLoadCheck) {
        let dataG = guruLoadCheck[idG];
        if (dataG.nonLinierJP > dataG.linierJP) {
          pelanggaranList.push(`- ${dataG.nama}: Jam Non-Linier (${dataG.nonLinierJP} JP) melebihi Jam Linier (${dataG.linierJP} JP)`);
        }
      }

      if (pelanggaranList.length > 0) {
        alert("GAGAL MENYIMPAN JADWAL!\n\nAturan Dapodik dilanggar: Jam mengajar non-linier tidak boleh lebih banyak daripada jam linier untuk guru berikut:\n\n" + pelanggaranList.join("\n"));
        return;
      }

      const payload = {
        action: "saveJadwalBatch",
        filterHari: document.getElementById("filterHari").value,
        filterKelas: document.getElementById("filterKelas").value,
        items: items
      };

      showLoading(true, "Menyimpan & Validasi Plotting Jadwal...");
      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        showLoading(false);
        if (res.status === "success") {
          alert("Plotting Jadwal berhasil disimpan dan validasi linier terpenuhi!");
          loadInitialData();
        } else {
          alert("Gagal menyimpan: " + res.message);
        }
      })
      .catch(err => {
        showLoading(false);
        alert("Error: " + err);
      });
    }

    function printJadwalMatrix() {
      const selHari = document.getElementById("filterHari").value;
      const selKelasVal = document.getElementById("filterKelas").value;
      const selKelasText = document.getElementById("filterKelas").options[document.getElementById("filterKelas").selectedIndex].text;
      
      let activeKelas = GLOBAL_DATA.kelas || [];
      if (selKelasVal !== "ALL") {
        activeKelas = activeKelas.filter(k => String(k.id_kelas) === String(selKelasVal));
      }

      let activeWaktu = GLOBAL_DATA.waktu || [];
      if (selHari !== "ALL") {
        activeWaktu = activeWaktu.filter(w => String(w.hari).toLowerCase() === String(selHari).toLowerCase());
      }

      const colorPalette = [
        "#ffdad6", "#ffdbc7", "#fff1c2", "#e2f8c9", "#cbf8eb", 
        "#cce7ff", "#e8dbff", "#ffdcf4", "#f0f0f0", "#d7e3fc",
        "#ffefe2", "#e4eddf", "#faeed7", "#e1f5fe", "#f3e5f5"
      ];

      const mapelColorMap = {};
      let colorIndex = 0;
      (GLOBAL_DATA.mapel || MASTER_MAPEL || []).forEach(m => {
        const mName = (m.nama || m).toLowerCase();
        if (!mapelColorMap[mName]) {
          mapelColorMap[mName] = colorPalette[colorIndex % colorPalette.length];
          colorIndex++;
        }
      });

      let printHeaderHtml = `
        <th style="width: 70px;">HARI</th>
        <th style="width: 50px;">JAM</th>
        <th style="width: 90px;">WAKTU</th>
        ${activeKelas.map(k => `<th>${k.nama_kelas}</th>`).join('')}
      `;

      const jadwalMap = {};
      (GLOBAL_DATA.jadwal || []).forEach(j => {
        const key = `${String(j.hari).toLowerCase()}_${j.jam_ke}_${j.id_kelas}`;
        if (!jadwalMap[key]) jadwalMap[key] = [];
        jadwalMap[key].push(j);
      });

      let printBodyHtml = "";
      const jamKeCounter = {};

      activeWaktu.forEach(w => {
        let waktuDisplay = `${cleanTimeString(w.waktu_mulai)} - ${cleanTimeString(w.waktu_selesai)}`;
        const jamKey = `${String(w.hari).toLowerCase()}_${w.jam_ke}`;
        jamKeCounter[jamKey] = (jamKeCounter[jamKey] || 0);
        const slotIndex = jamKeCounter[jamKey];
        jamKeCounter[jamKey]++;

        let cellsHtml = "";
        activeKelas.forEach(k => {
          const key = `${String(w.hari).toLowerCase()}_${w.jam_ke}_${k.id_kelas}`;
          const matchedList = jadwalMap[key] || [];
          const currentJadwal = matchedList[slotIndex] || {};

          let cellContent = "-";
          if (currentJadwal.id_guru) {
            const guruObj = (GLOBAL_DATA.guru || []).find(g => String(g.id_guru).trim() === String(currentJadwal.id_guru).trim());
            if (guruObj) {
              const mapelKey = (currentJadwal.mapel || "").toLowerCase();
              const bgColor = mapelColorMap[mapelKey] || "#f0f0f0";
              cellContent = `<span style="background-color: ${bgColor}; padding: 3px 6px; border-radius: 4px; display: inline-block; font-weight: bold; border: 1px solid #bbb;">${guruObj.kode_guru}</span>`;
            }
          }

          cellsHtml += `<td style="text-align: center; font-size: 0.75rem; vertical-align: middle;">${cellContent}</td>`;
        });

        printBodyHtml += `
          <tr>
            <td style="text-align: center; vertical-align: middle;">${w.hari}</td>
            <td style="text-align: center; vertical-align: middle;"><b>${w.jam_ke}</b></td>
            <td style="text-align: center; font-size: 0.7rem; vertical-align: middle;">${waktuDisplay}</td>
            ${cellsHtml}
          </tr>
        `;
      });

      const customTableHTML = `
        <table class="table table-bordered table-sm table-matrix">
          <thead class="table-dark">
            <tr>${printHeaderHtml}</tr>
          </thead>
          <tbody>${printBodyHtml}</tbody>
        </table>
      `;

      let legendItemsHtml = "";
      for (let mName in mapelColorMap) {
        let col = mapelColorMap[mName];
        let capitalizedName = mName.charAt(0).toUpperCase() + mName.slice(1);
        legendItemsHtml += `
          <div style="display: inline-block; margin-right: 15px; margin-bottom: 5px; font-size: 0.75rem;">
            <span style="background-color: ${col}; display: inline-block; width: 14px; height: 14px; border: 1px solid #777; margin-right: 4px; vertical-align: middle;"></span>
            ${capitalizedName}
          </div>
        `;
      }

      const printWindow = window.open('', '_blank', 'width=1000,height=700');
      printWindow.document.write(`
        <!DOCTYPE html>
        <html lang="id">
        <head>
          <meta charset="UTF-8">
          <title>Cetak Jadwal Pelajaran - SIM TimeTable</title>
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
          <style>
            body { padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #000; }
            h3, h4, p { text-align: center; margin: 2px 0; }
            .table-matrix th, .table-matrix td { border: 1px solid #000 !important; padding: 3px !important; }
            .legend-box { border: 1px solid #ccc; padding: 8px; border-radius: 6px; margin-top: 15px; background: #fafafa; }
            @media print {
              .no-print { display: none; }
              @page { size: landscape; }
            }
          </style>
        </head>
        <body>
          <div class="container-fluid">
            <h4 class="fw-bold">PEMERINTAH KABUPATEN MOJOKERTO</h4>
            <h3 class="fw-bold text-uppercase">SMP NEGERI 1 BANGSAL</h3>
